<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avilas Detailing</title>

  <style>
    /* Global Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #0f1115;
      color: #f5f5f5;
      line-height: 1.6;
    }

    /* Page Wrapper */
    .page {
      width: 100%;
      padding: 24px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .logo,
    .header-pic {
      width: 120px;
      height: 80px;
      border: 2px dashed #555;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #aaa;
    }

    h1 {
      font-size: 42px;
      text-align: center;
      flex: 1;
      font-family: cursive;
    }

    /* Sub Header */
    .sub-header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 40px;
      font-size: 16px;
      max-width: 900px;
      margin: 0 auto 40px auto;
    }

    .sub-header .right {
      text-align: right;
      font-weight: bold;
    }

    /* Section Titles */
    .section-title {
      text-align: center;
      font-size: 28px;
      margin: 40px 0 24px;
    }

    /* Videos */
    .videos {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .video-box {
      width: 100%;
      max-width: 520px;
      aspect-ratio: 16 / 9;
      border: 2px dashed #555;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      background: #151821;
    }

    .work-description {
      text-align: center;
      margin: 28px 0;
      font-size: 16px;
      color: #ddd;
    }

    /* Price List */
    .price-section {
      display: flex;
      justify-content: center;
      margin-top: 40px;
    }

    .price-box {
      width: 100%;
      max-width: 360px;
      background: #151821;
      border-radius: 14px;
      padding: 24px;
      border: 1px solid #2a2f3a;
    }

    .price-box h3 {
      text-align: center;
      margin-bottom: 16px;
      font-size: 22px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #2a2f3a;
      font-size: 16px;
    }

    .price-row:last-child {
      border-bottom: none;
    }

    .icon {
        box-sizing: border-box;
        position: relative;
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 5px solid white;
        border-radius: 100%;
    }

    .icon::after {
        position: absolute;
        top: 100%;
        left: 50%;
        margin: 1px 0 0 -6px;
        display: block;
        content: '';
        border: 6px solid transparent;
        border-top: 10px solid white;
        border-bottom: none;
    }

    /* Mobile Optimization */
    @media (max-width: 768px) {
      h1 {
        font-size: 32px;
      }

      .header {
        flex-direction: column;
      }

      .sub-header {
        flex-direction: column;
        text-align: center;
      }

      .sub-header .right {
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- Header -->
    <div class="header">
      <div class="logo">logo.png</div>
      <h1>Avilas Detailing</h1>
      <div class="header-pic">pic.png</div>
    </div>

    <!-- Sub Header -->
    <div class="sub-header">
      <div>
        <strong>We come to you!</strong><br />
        <i class="icon"></i> Inland Empire
      </div>
      <div class="right">
        Text or Call For Bookings<br />
        (123) 456-7890
      </div>
    </div>

    <!-- Previous Work -->
    <h2 class="section-title">Previous Work</h2>

    <div class="videos">
      <div class="video-box">YouTube Video</div>
      <div class="video-box">YouTube Video</div>
    </div>

    <div class="work-description">
      We work on cars, boats, trucks, SUV's, RV's, semis, etc...
    </div>

    <!-- Price List -->
    <div class="price-section">
      <div class="price-box">
        <h3>Price List</h3>

        <div class="price-row">
          <span>SUV's</span>
          <span>$100</span>
        </div>

        <div class="price-row">
          <span>Cars</span>
          <span>$60</span>
        </div>

        <div class="price-row">
          <span>Boats</span>
          <span>$160</span>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
